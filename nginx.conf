user  nginx;
worker_processes  auto;
events {
    worker_connections  1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 50M;

    # Gzip para performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    # Redireciona HTTP para HTTPS
    server {
        listen 80;
        server_name victorbenevides.dev www.victorbenevides.dev radarani.site www.radarani.site;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Configuração HTTPS
    server {
        listen 443 ssl;
        server_name victorbenevides.dev www.victorbenevides.dev radarani.site www.radarani.site;

        ssl_certificate /etc/letsencrypt/live/victorbenevides.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/victorbenevides.dev/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;
        index index.html;

        # API Proxy
        location ^~ /api/ {
            proxy_pass http://server:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Page Proxy (Short URLs)
        location /p/ {
            proxy_pass http://server:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploads
        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            try_files $uri @backend_fallback;
        }

        location @backend_fallback {
            proxy_pass http://server:8080;
        }

        # SPA Routing
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
