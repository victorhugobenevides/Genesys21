user  nginx;
worker_processes  auto;
events {
    worker_connections  1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    # Redirecionamento de HTTP para HTTPS
    server {
        listen 80 default_server;
        server_name victorbenevides.dev www.victorbenevides.dev radarani.site www.radarani.site localhost;

        # Prioridade absoluta para o desafio do Certbot
        location ^~ /.well-known/acme-challenge/ {
            alias /var/www/certbot/.well-known/acme-challenge/;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Configuração HTTPS (Produção)
    server {
        listen 443 ssl;
        server_name victorbenevides.dev www.victorbenevides.dev radarani.site www.radarani.site localhost;

        ssl_certificate /etc/letsencrypt/live/victorbenevides.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/victorbenevides.dev/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location ^~ /.well-known/acme-challenge/ {
            alias /var/www/certbot/.well-known/acme-challenge/;
            allow all;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://server:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /p/ {
            proxy_pass http://server:8080/p/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            try_files $uri @backend_fallback;
        }

        location @backend_fallback {
            proxy_pass http://server:8080;
        }
    }
}
