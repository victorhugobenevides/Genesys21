user  nginx;
worker_processes  auto;
events {
    worker_connections  1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    server {
        listen 80;
        server_name victorbenevides.dev www.victorbenevides.dev radarani.site www.radarani.site localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Configuração para Localhost (HTTP)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://server:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /p/ {
            proxy_pass http://server:8080/p/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            try_files $uri @backend_fallback;
        }

        location @backend_fallback {
            proxy_pass http://server:8080;
        }
    }

    # O bloco 443 deve ser adicionado apenas em produção ou quando os certificados existirem.
    # Para não quebrar o Nginx local, ele fica comentado ou em arquivo separado na pipeline.
}
