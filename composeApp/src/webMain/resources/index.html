<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <base href="/">
    <title>Social Bio [v5.3.4-FIX]</title>

    <script>
        // ULTIMATE GLOBAL POLYFILL: crypto.randomUUID (Indispensável para contextos não-HTTPS/IP)
        (function(g) {
            try {
                g.crypto = g.crypto || {};
                if (typeof g.crypto.randomUUID !== 'function') {
                    g.crypto.randomUUID = function() {
                        return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, function(c) {
                            var r = (g.crypto.getRandomValues ? g.crypto.getRandomValues(new Uint8Array(1))[0] : Math.random() * 256) & (15 >> (c / 4));
                            return (c ^ r).toString(16);
                        });
                    };
                    console.log("BRIDGE: Ultimate Polyfill crypto.randomUUID applied to", g);
                }
            } catch (e) {
                console.error("BRIDGE: Failed to apply polyfill:", e);
            }
        })(typeof globalThis !== 'undefined' ? globalThis : typeof window !== 'undefined' ? window : typeof self !== 'undefined' ? self : this);
    </script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://connect-js.stripe.com/v1.0/sdk.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="bridge.js"></script>

    <link type="text/css" rel="stylesheet" href="styles.css">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            height: -webkit-fill-available;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #F2F2F7;
            position: fixed;
            left: 0;
            top: 0;
            touch-action: none;
        }
        #ComposeTarget { width: 100%; height: 100%; }
        canvas { outline: none; width: 100% !important; height: 100% !important; display: block; }

        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #F2F2F7; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(0,0,0,0.1);
            border-left-color: #007AFF; border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
        // CAPABILITY CHECK (CRITICAL FOR iOS)
        window.addEventListener('load', function() {
            const overlay = document.getElementById('loading-overlay');
            const status = document.getElementById('loading-status');

            // Check for Wasm GC support
            try {
                if (typeof WebAssembly !== "object" || !WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]))) {
                    throw new Error("Wasm GC não suportado");
                }
                status.innerText = "Iniciando motor gráfico...";
            } catch (e) {
                overlay.innerHTML = `<div style="padding: 20px; text-align: center;">
                    <h2 style="color: #FF3B30;">Navegador Incompatível</h2>
                    <p>O Genesys21 exige suporte a Wasm GC (iOS 17.4+ ou navegadores modernos).</p>
                    <p style="font-size: 12px; color: #666;">Erro: ${e.message}</p>
                </div>`;
            }
        });
    </script>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-status" style="margin-top: 20px; color: #8E8E93; font-size: 14px;">Carregando Genesys21...</p>
    </div>
    <div id="ComposeTarget"></div>
    <script src="composeApp.js"></script>
</body>
</html>
