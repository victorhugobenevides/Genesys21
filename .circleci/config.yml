version: 2.1

orbs:
  android: circleci/android@2.5.0

jobs:
  test-and-validate:
    executor:
      name: android/android-machine
      resource-class: large
      tag: 2024.01.1
    steps:
      - checkout
      - run:
          name: Decode Secrets
          command: |
            if [ -n "$GOOGLE_SERVICES_JSON_ANDROID" ]; then
              CLEAN_VAR=$(echo "$GOOGLE_SERVICES_JSON_ANDROID" | tr -d '[:space:]')
              echo "$CLEAN_VAR" | base64 --decode > composeApp/google-services.json || echo "$GOOGLE_SERVICES_JSON_ANDROID" > composeApp/google-services.json
            fi
            if [ -n "$FIREBASE_ADMIN_JSON" ]; then
              echo "${FIREBASE_ADMIN_JSON}" > firebase-adminsdk.json
              mkdir -p server/src/main/resources
              echo "${FIREBASE_ADMIN_JSON}" > server/src/main/resources/firebase-adminsdk.json
            fi
      - run:
          name: Run Unit Tests
          command: ./gradlew :composeApp:testDebugUnitTest :shared:testDebugUnitTest :server:test -Pandroid.useAndroidX=true --no-daemon
      - run:
          name: Verify Visual Integrity
          command: ./gradlew :screenshot-tests:verifyPaparazziDebug --no-daemon
      - persist_to_workspace:
          root: .
          paths:
            - .

  deploy:
    docker:
      - image: cimg/openjdk:21.0
    environment:
      DOCKER_API_VERSION: "1.41"
    parameters:
      environment_name:
        type: enum
        enum: ["prod", "staging"]
        default: "staging"
    steps:
      - checkout
      - attach_workspace:
          at: .
      - setup_remote_docker:
          version: 20.10.24
      - run:
          name: Build Distribution
          command: |
            ./gradlew clean :server:installDist :composeApp:wasmJsBrowserDistribution -Pandroid.useAndroidX=true --no-daemon
            rm -rf deploy/server deploy/web
            mkdir -p deploy/server deploy/web
      - run:
          name: Prepare and Push Docker Images
          command: |
            REGISTRY=${OCI_REGION}.ocir.io/${OCI_TENANCY_NAMESPACE}
            TAG=<< parameters.environment_name >>
            [ "$TAG" = "prod" ] && TAG="latest"

            echo "$OCI_AUTH_TOKEN" | docker login ${OCI_REGION}.ocir.io -u "${OCI_TENANCY_NAMESPACE}/${OCI_USER}" --password-stdin

            # Criar pastas de deploy
            mkdir -p deploy/server deploy/web

            # Copiar artefatos do Servidor
            cp -R server/build/install/server/. deploy/server/
            cp firebase-adminsdk.json deploy/server/ 2>/dev/null || true

            # Copiar artefatos Web (Wasm/JS)
            WEB_DIST_DIR=$(find composeApp/build/dist/wasmJs -name "productionExecutable" -o -name "distribution" | head -n 1)
            if [ -n "$WEB_DIST_DIR" ]; then
                find "$WEB_DIST_DIR" -type f \( -name "*.js" -o -name "*.wasm" -o -name "*.html" -o -name "*.css" -o -name "*.mjs" -o -name "*.map" \) -exec cp -f {} deploy/web/ \;
            fi

            # Gerar index.html customizado para o deploy
            cat \<<EOF > deploy/web/index.html
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
                <title>Genesys21</title>
                <link rel="preload" href="/composeApp.wasm" as="fetch" type="application/wasm" crossorigin>
                <script src="https://accounts.google.com/gsi/client" async defer></script>
                <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
                <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
                <script type="module" src="/firebase-bridge.js"></script>
                <style>
                    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #F2F2F7; position: fixed; left: 0; top: 0; touch-action: manipulation; }
                    #ComposeTarget { width: 100%; height: 100%; }
                    canvas { outline: none; width: 100% !important; height: 100% !important; display: block; }
                </style>
            </head>
            <body>
                <div id="ComposeTarget"></div>
                <script src="/composeApp.js"></script>
            </body>
            </html>
            EOF

            # Gerar ponte Firebase
            cat \<<EOF > deploy/web/firebase-bridge.js
            const firebaseConfig = {
                apiKey: "AIzaSyCq22tklAK0iQd4jWDINkJZAS9-I_-dLSY",
                authDomain: "genesys21-32035.firebaseapp.com",
                projectId: "genesys21-32035",
                storageBucket: "genesys21-32035.firebasestorage.app",
                appId: "1:674755208954:web:26e7b20a54f9ceb0dc4b43"
            };
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();

            let oneTapInitialized = false;
            window.firebaseInitializeOneTap = () => {
                if (oneTapInitialized || auth.currentUser || typeof google === 'undefined') return;
                oneTapInitialized = true;
                console.log("BRIDGE: Iniciando One Tap...");
                google.accounts.id.initialize({
                    client_id: "${GOOGLE_WEB_CLIENT_ID}",
                    callback: (response) => {
                        const credential = firebase.auth.GoogleAuthProvider.credential(response.credential);
                        auth.signInWithCredential(credential)
                            .then(() => console.log("BRIDGE: One Tap Login Sucesso"))
                            .catch(err => console.error("BRIDGE: One Tap Login Erro", err));
                    }
                });
                google.accounts.id.prompt();
            };

            window.firebaseSignIn = (email, pass) => auth.signInWithEmailAndPassword(email, pass).then(u => u.user.getIdToken());
            window.firebaseSignInGoogle = () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                return auth.signInWithPopup(provider).then(u => u.user.getIdToken());
            };
            window.firebaseGetToken = () => auth.currentUser ? auth.currentUser.getIdToken() : Promise.resolve(null);
            window.firebaseGetUserId = () => Promise.resolve(auth.currentUser ? auth.currentUser.uid : null);
            window.firebaseSignOut = () => { oneTapInitialized = false; return auth.signOut(); };
            window.firebaseOnAuthChanged = (cb) => auth.onAuthStateChanged(u => cb(u ? u.uid : null));
            EOF

            # Build and Push
            docker build -t $REGISTRY/genesys-server:$TAG -f Dockerfile.server .
            docker build -t $REGISTRY/genesys-web:$TAG -f Dockerfile.web .
            docker push $REGISTRY/genesys-server:$TAG
            docker push $REGISTRY/genesys-web:$TAG
      - run:
          name: Smoke Test (Boot Check)
          command: |
            REGISTRY=${OCI_REGION}.ocir.io/${OCI_TENANCY_NAMESPACE}
            TAG=<< parameters.environment_name >>
            [ "$TAG" = "prod" ] && TAG="latest"

            docker run -d --name smoke-test-server -e "ktor.testing=true" $REGISTRY/genesys-server:$TAG

            SUCCESS=0
            for i in $(seq 1 30); do
              # Testa boot e conectividade com banco
              if docker exec smoke-test-server curl -s -f http://localhost:8080/api/booking/services > /dev/null; then
                echo "✓ Server and DB connection successful!"
                SUCCESS=1
                break
              fi
              echo "Waiting for server and DB... ($i/30)"
              sleep 1

              # Verifica se o container morreu e mostra logs
              if [ "$(docker inspect -f '{{.State.Running}}' smoke-test-server 2>/dev/null)" = "false" ]; then
                echo "ERROR: Server container crashed during boot!"
                docker logs smoke-test-server
                docker rm -f smoke-test-server
                exit 1
              fi
            done
            docker rm -f smoke-test-server
            if [ $SUCCESS -eq 0 ]; then
                echo "CRITICAL: Server failed to start!"
                exit 1
            fi
      - run:
          name: Remote Deploy via SSH
          command: |
            ENV=<< parameters.environment_name >>
            REGISTRY="${OCI_REGION}.ocir.io/${OCI_TENANCY_NAMESPACE}"

            # SSH Key Setup
            mkdir -p ~/.ssh
            python3 -c "import os, base64; key = os.environ['OCI_SSH_KEY'].strip(); path = os.path.expanduser('~/.ssh/oracle_key'); open(path, 'wb').write(base64.b64decode(key) if ' ' not in key else key.encode())"
            chmod 600 ~/.ssh/oracle_key
            ssh-keyscan -H "${OCI_HOST}" >> ~/.ssh/known_hosts

            if [ "$ENV" = "prod" ]; then
              TAG="latest"
              TARGET_DIR="~/app"
              B_TAG="latest"
            else
              TAG="staging"
              TARGET_DIR="~/staging"
              B_TAG="staging"
            fi

            # Gerar Nginx Config
            cat \<<EOF > nginx.conf
            user  nginx;
            worker_processes  auto;
            events { worker_connections  1024; }
            http {
                include /etc/nginx/mime.types;
                default_type application/octet-stream;
                client_max_body_size 50M;
                gzip on;

                # Resolver interno do Docker para permitir que o Nginx inicie mesmo se um container falhar
                resolver 127.0.0.11 valid=30s;

                server {
                    listen 80;
                    server_name victorbenevides.dev www.victorbenevides.dev staging.victorbenevides.dev;
                    location / { return 301 https://\$host\$request_uri; }
                }
                server {
                    listen 443 ssl default_server;
                    server_name victorbenevides.dev www.victorbenevides.dev;
                    ssl_certificate /etc/letsencrypt/live/victorbenevides.dev/fullchain.pem;
                    ssl_certificate_key /etc/letsencrypt/live/victorbenevides.dev/privkey.pem;
                    root /usr/share/nginx/html;
                    index index.html;

                    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";

                    location /api/ {
                        set \$upstream_prod app-server-1;
                        proxy_pass http://\$upstream_prod:8080\$request_uri;
                        proxy_set_header Host \$host;
                        proxy_set_header X-Real-IP \$remote_addr;
                        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto \$scheme;
                    }
                    location / { try_files \$uri \$uri/ /index.html; }
                }
                server {
                    listen 443 ssl;
                    server_name staging.victorbenevides.dev;
                    ssl_certificate /etc/letsencrypt/live/victorbenevides.dev/fullchain.pem;
                    ssl_certificate_key /etc/letsencrypt/live/victorbenevides.dev/privkey.pem;
                    root /usr/share/nginx/html/staging;
                    index index.html;

                    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";

                    location /api/ {
                        set \$upstream_staging staging-server-1;
                        proxy_pass http://\$upstream_staging:8080\$request_uri;
                        proxy_set_header Host \$host;
                        proxy_set_header X-Real-IP \$remote_addr;
                        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto \$scheme;
                    }
                    location / { try_files \$uri \$uri/ /index.html; }
                }
            }
            EOF

            # Gerar Docker Compose
            if [ "$ENV" = "prod" ]; then
              cat \<<EOF > docker-compose.yml
            services:
              server:
                container_name: app-server-1
                image: ${REGISTRY}/genesys-server:latest
                environment:
                  - PROD_MODE=true
                  - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
                volumes:
                  - ./data:/app/data
                  - ./uploads:/app/uploads
                restart: unless-stopped
                networks: [genesys-network]
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8080/"]
              web:
                image: ${REGISTRY}/genesys-web:latest
                depends_on:
                  server: { condition: service_healthy }
                ports: ["80:80", "443:443"]
                volumes:
                  - ./nginx.conf:/etc/nginx/nginx.conf:ro
                  - ./uploads:/usr/share/nginx/html/uploads:ro
                  - ./staging-web:/usr/share/nginx/html/staging:ro
                  - ./certbot/conf:/etc/letsencrypt:ro
                restart: unless-stopped
                networks: [genesys-network]
            networks:
              genesys-network: { driver: bridge }
            EOF
            else
              cat \<<EOF > docker-compose.staging.yml
            services:
              server:
                container_name: staging-server-1
                image: ${REGISTRY}/genesys-server:staging
                environment:
                  - PROD_MODE=false
                  - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
                volumes:
                  - ./data-staging:/app/data
                  - ./uploads-staging:/app/uploads
                restart: unless-stopped
                networks: [genesys-network]
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8080/"]
            networks:
              genesys-network: { external: true }
            EOF
            fi

            # Deploy
            ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no ubuntu@${OCI_HOST} "mkdir -p ${TARGET_DIR}"
            if [ "$ENV" = "prod" ]; then
                scp -i ~/.ssh/oracle_key nginx.conf docker-compose.yml ubuntu@${OCI_HOST}:${TARGET_DIR}/
                ssh -i ~/.ssh/oracle_key ubuntu@${OCI_HOST} "cd ${TARGET_DIR} && sudo docker compose pull && sudo docker compose up -d"
            else
                # Envia o docker-compose de staging
                scp -i ~/.ssh/oracle_key docker-compose.staging.yml ubuntu@${OCI_HOST}:${TARGET_DIR}/

                # Sincroniza os arquivos web de staging para que o Nginx de prod possa servir
                ssh -i ~/.ssh/oracle_key ubuntu@${OCI_HOST} "mkdir -p ~/app/staging-web"
                scp -i ~/.ssh/oracle_key -r deploy/web/. ubuntu@${OCI_HOST}:~/app/staging-web/

                ssh -i ~/.ssh/oracle_key ubuntu@${OCI_HOST} "sudo docker network create genesys-network || true"
                ssh -i ~/.ssh/oracle_key ubuntu@${OCI_HOST} "cd ${TARGET_DIR} && sudo docker compose -f docker-compose.staging.yml pull && sudo docker compose -f docker-compose.staging.yml up -d"
            fi

workflows:
  validate-and-deploy:
    jobs:
      - test-and-validate
      - deploy:
          name: deploy-prod
          environment_name: prod
          requires: [test-and-validate]
          filters: { branches: { only: main } }
      - deploy:
          name: deploy-staging
          environment_name: staging
          requires: [test-and-validate]
          filters: { branches: { only: develop } }
