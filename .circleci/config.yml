version: 2.1

orbs:
  android: circleci/android@2.5.0

jobs:
  test-and-validate:
    executor:
      name: android/android-machine
      resource-class: large
      tag: 2024.01.1
    steps:
      - checkout
      - run:
          name: Decode Google Services JSON (Android)
          command: |
            if [ -n "$GOOGLE_SERVICES_JSON_ANDROID" ]; then
              CLEAN_VAR=$(echo "$GOOGLE_SERVICES_JSON_ANDROID" | tr -d '[:space:]')
              echo "$CLEAN_VAR" | base64 --decode > composeApp/google-services.json || echo "$GOOGLE_SERVICES_JSON_ANDROID" > composeApp/google-services.json
              echo "✓ decoded google-services.json"
            fi
      - run:
          name: Decode Firebase Admin JSON (Server)
          command: |
            if [ -n "$FIREBASE_ADMIN_JSON" ]; then
              echo "${FIREBASE_ADMIN_JSON}" > firebase-adminsdk.json
              mkdir -p server/src/main/resources
              echo "${FIREBASE_ADMIN_JSON}" > server/src/main/resources/firebase-adminsdk.json
              echo "✓ decoded firebase-adminsdk.json"
            fi
      - run:
          name: Setup Java
          command: |
            java -version
      - run:
          name: Grant execute permission for gradlew
          command: chmod +x gradlew
      - run:
          name: Run Unit Tests & Coverage
          command: |
            ./gradlew :composeApp:testDebugUnitTest :shared:testDebugUnitTest :server:test -Pandroid.useAndroidX=true --no-daemon
            ./gradlew :server:jacocoTestReport --no-daemon

            # Coleta resultados
            mkdir -p /tmp/test-results/junit
            find . -type f -name "*.xml" -path "*/build/test-results/*" -exec cp {} /tmp/test-results/junit/ \;
      - run:
          name: Verify Visual Integrity (Screenshot Tests)
          command: ./gradlew :screenshot-tests:verifyPaparazziDebug --no-daemon
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
          destination: tr

  deploy:
    docker:
      - image: cimg/openjdk:21.0
    parameters:
      environment_name:
        type: enum
        enum: ["prod", "staging"]
        default: "staging"
    steps:
      - checkout
      - run:
          name: Decode Google Services JSON (Android)
          command: |
            if [ -n "$GOOGLE_SERVICES_JSON_ANDROID" ]; then
              CLEAN_VAR=$(echo "$GOOGLE_SERVICES_JSON_ANDROID" | tr -d '[:space:]')
              echo "$CLEAN_VAR" | base64 --decode > composeApp/google-services.json || echo "$GOOGLE_SERVICES_JSON_ANDROID" > composeApp/google-services.json
            fi
      - run:
          name: Decode Firebase Admin JSON (Server)
          command: |
            if [ -n "$FIREBASE_ADMIN_JSON" ]; then
              echo "${FIREBASE_ADMIN_JSON}" > firebase-adminsdk.json
            fi
      - setup_remote_docker:
          version: 20.10.24
      - run:
          name: Build Distribution
          command: ./gradlew :server:installDist :composeApp:wasmJsBrowserDistribution -Pandroid.useAndroidX=true --no-daemon
      - run:
          name: Prepare and Push Docker Images
          command: |
            REGISTRY=${OCI_REGION}.ocir.io/${OCI_TENANCY_NAMESPACE}
            TAG=<< parameters.environment_name >>
            [ "$TAG" = "prod" ] && TAG="latest"

            echo "$OCI_AUTH_TOKEN" | docker login ${OCI_REGION}.ocir.io -u "${OCI_TENANCY_NAMESPACE}/${OCI_USER}" --password-stdin

            docker build -t $REGISTRY/genesys-server:$TAG -f Dockerfile.server .
            docker build -t $REGISTRY/genesys-web:$TAG -f Dockerfile.web .
            docker push $REGISTRY/genesys-server:$TAG
            docker push $REGISTRY/genesys-web:$TAG
      - run:
          name: Smoke Test (Boot Check)
          command: |
            REGISTRY=${OCI_REGION}.ocir.io/${OCI_TENANCY_NAMESPACE}
            TAG=<< parameters.environment_name >>
            [ "$TAG" = "prod" ] && TAG="latest"

            docker run -d --name smoke-test-server -e "ktor.testing=true" $REGISTRY/genesys-server:$TAG

            SUCCESS=0
            for i in $(seq 1 30); do
              if docker exec smoke-test-server curl -s -f http://localhost:8080/ > /dev/null; then
                echo "✓ Server boot successful!"
                SUCCESS=1
                break
              fi
              sleep 1
            done
            docker rm -f smoke-test-server
            [ $SUCCESS -eq 0 ] && exit 1 || true
      - run:
          name: Setup SSH
          command: |
            mkdir -p ~/.ssh
            python3 -c "import os, base64; key = os.environ['OCI_SSH_KEY'].strip(); path = os.path.expanduser('~/.ssh/oracle_key'); open(path, 'wb').write(base64.b64decode(key) if ' ' not in key else key.encode())"
            chmod 600 ~/.ssh/oracle_key
            ssh-keyscan -H "${OCI_HOST}" >> ~/.ssh/known_hosts
      - run:
          name: Remote Deploy via SSH
          command: |
            ENV=<< parameters.environment_name >>
            REGISTRY="${OCI_REGION}.ocir.io/${OCI_TENANCY_NAMESPACE}"

            if [ "$ENV" = "prod" ]; then
              TAG="latest"
              TARGET_DIR="~/app"
              CONTAINER_NAME="app-server-1"
            else
              TAG="staging"
              TARGET_DIR="~/staging"
              CONTAINER_NAME="staging-server-1"
            fi

            # Gerar Nginx Config Localmente
            cat \<<EOF > nginx.conf
            user  nginx;
            worker_processes  auto;
            events { worker_connections  1024; }
            http {
                include /etc/nginx/mime.types;
                types { application/wasm wasm; }
                default_type application/octet-stream;
                client_max_body_size 50M;
                gzip on;

                # Produção
                server {
                    listen 80;
                    server_name victorbenevides.dev www.victorbenevides.dev;
                    location / { return 301 https://\$host\$request_uri; }
                }
                server {
                    listen 443 ssl default_server;
                    server_name victorbenevides.dev www.victorbenevides.dev;
                    ssl_certificate /etc/letsencrypt/live/victorbenevides.dev/fullchain.pem;
                    ssl_certificate_key /etc/letsencrypt/live/victorbenevides.dev/privkey.pem;
                    root /usr/share/nginx/html;
                    index index.html;
                    location /api/ {
                        proxy_pass http://app-server-1:8080/api/;
                        proxy_set_header Host \$host;
                        proxy_set_header X-Real-IP \$remote_addr;
                    }
                    location / { try_files \$uri \$uri/ /index.html; }
                }

                # Staging
                server {
                    listen 80;
                    server_name staging.victorbenevides.dev;
                    location / { return 301 https://\$host\$request_uri; }
                }
                server {
                    listen 443 ssl;
                    server_name staging.victorbenevides.dev;
                    ssl_certificate /etc/letsencrypt/live/victorbenevides.dev/fullchain.pem;
                    ssl_certificate_key /etc/letsencrypt/live/victorbenevides.dev/privkey.pem;
                    root /usr/share/nginx/html/staging;
                    index index.html;
                    location /api/ {
                        proxy_pass http://staging-server-1:8080/api/;
                        proxy_set_header Host \$host;
                        proxy_set_header X-Real-IP \$remote_addr;
                    }
                    location / { try_files \$uri \$uri/ /index.html; }
                }
            }
            EOF

            # Gerar Docker Compose
            if [ "$ENV" = "prod" ]; then
              cat \<<EOF > docker-compose.yml
            services:
              server:
                container_name: app-server-1
                image: ${REGISTRY}/genesys-server:latest
                environment:
                  - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
                  - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
                  - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
                  - PROD_MODE=true
                volumes:
                  - ./data:/app/data
                  - ./uploads:/app/uploads
                restart: unless-stopped
                networks:
                  - genesys-network
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8080/"]
              web:
                image: ${REGISTRY}/genesys-web:latest
                depends_on:
                  server: { condition: service_healthy }
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - ./nginx.conf:/etc/nginx/nginx.conf:ro
                  - ./uploads:/usr/share/nginx/html/uploads:ro
                  - ./certbot/conf:/etc/letsencrypt:ro
                restart: unless-stopped
                networks:
                  - genesys-network
            networks:
              genesys-network: { driver: bridge }
            EOF
            else
              cat \<<EOF > docker-compose.staging.yml
            services:
              server:
                container_name: staging-server-1
                image: ${REGISTRY}/genesys-server:staging
                environment:
                  - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
                  - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
                  - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
                  - PROD_MODE=false
                volumes:
                  - ./data-staging:/app/data
                  - ./uploads-staging:/app/uploads
                restart: unless-stopped
                networks:
                  - genesys-network
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8080/"]
            networks:
              genesys-network: { external: true }
            EOF
            fi

            # Transferência e Execução
            ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no ubuntu@${OCI_HOST} "mkdir -p ${TARGET_DIR}"

            if [ "$ENV" = "prod" ]; then
                scp -i ~/.ssh/oracle_key nginx.conf docker-compose.yml ubuntu@${OCI_HOST}:${TARGET_DIR}/
                ssh -i ~/.ssh/oracle_key ubuntu@${OCI_HOST} "cd ${TARGET_DIR} && sudo docker compose pull && sudo docker compose up -d"
            else
                scp -i ~/.ssh/oracle_key docker-compose.staging.yml ubuntu@${OCI_HOST}:${TARGET_DIR}/
                ssh -i ~/.ssh/oracle_key ubuntu@${OCI_HOST} "cd ${TARGET_DIR} && sudo docker network create genesys-network || true && sudo docker compose -f docker-compose.staging.yml pull && sudo docker compose -f docker-compose.staging.yml up -d"
            fi

workflows:
  validate-and-deploy:
    jobs:
      - test-and-validate
      - deploy:
          name: deploy-prod
          environment_name: prod
          requires: [test-and-validate]
          filters: { branches: { only: main } }
      - deploy:
          name: deploy-staging
          environment_name: staging
          requires: [test-and-validate]
          filters: { branches: { only: develop } }
