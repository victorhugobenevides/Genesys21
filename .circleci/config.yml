version: 2.1

orbs:
  docker: circleci/docker@2.1.4

commands:
  prepare-env:
    description: "Prepare environment by decoding secrets or creating dummy configs"
    steps:
      - run:
          name: Prepare Environment & Decode Secrets
          command: |
            # 1. Tentar decodificar GOOGLE_SERVICES_JSON_ANDROID real
            if [ -n "$GOOGLE_SERVICES_JSON_ANDROID" ]; then
              CLEAN_VAR=$(echo "$GOOGLE_SERVICES_JSON_ANDROID" | tr -d '[:space:]')
              echo "$CLEAN_VAR" | base64 --decode > composeApp/google-services.json || echo "$GOOGLE_SERVICES_JSON_ANDROID" > composeApp/google-services.json
              echo "✓ Real google-services.json injected from environment."
            else
              # Fallback dummy com package_name CORRETO
              echo '{"project_info":{"project_number":"0","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"0","android_client_info":{"package_name":"com.itbenevides.genesys21"}},"api_key":[{"current_key":"dummy"}]}]}' > composeApp/google-services.json
              echo "⚠ Using dummy google-services.json (Missing env var)."
            fi

            # 2. Tentar decodificar FIREBASE_ADMIN_JSON real
            mkdir -p server/src/main/resources
            if [ -n "$FIREBASE_ADMIN_JSON" ]; then
              echo "${FIREBASE_ADMIN_JSON}" > server/firebase-adminsdk.json
              echo "${FIREBASE_ADMIN_JSON}" > server/src/main/resources/firebase-adminsdk.json
              echo "✓ Real firebase-adminsdk.json injected from environment."
            else
              echo '{"project_id":"dummy","private_key":"dummy","client_email":"dummy"}' > server/firebase-adminsdk.json
              echo '{"project_id":"dummy","private_key":"dummy","client_email":"dummy"}' > server/src/main/resources/firebase-adminsdk.json
              echo "⚠ Using dummy firebase-adminsdk.json (Missing env var)."
            fi

            # Criar diretório de dados para SQLite
            mkdir -p server/data

jobs:
  test-and-validate:
    docker:
      - image: cimg/android:2024.01
    resource_class: large
    environment:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" -Dorg.gradle.workers.max=2
    steps:
      - checkout
      - prepare-env
      - run:
          name: Run Unit Tests (Shared, App, Server)
          command: ./gradlew :shared:test :composeApp:testDebugUnitTest :server:test --no-daemon
      - run:
          name: Run Static Analysis
          command: ./gradlew lint --no-daemon

  visual-verification:
    docker:
      - image: cimg/android:2024.01
    resource_class: large
    environment:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=512m" -Dorg.gradle.workers.max=1
    steps:
      - checkout
      - prepare-env
      - run:
          name: Verify Visual Snapshots (Paparazzi)
          command: ./gradlew :screenshot-tests:verifyPaparazziDebug --no-daemon

  build-and-push:
    docker:
      - image: cimg/android:2024.01
    resource_class: large
    steps:
      - checkout
      - prepare-env
      - setup_remote_docker:
          version: 20.10.24
          docker_layer_caching: true
      - run:
          name: Build Backend (Server)
          command: |
            export GRADLE_OPTS="-Xmx3g -XX:MaxMetaspaceSize=512m"
            ./gradlew :server:installDist --no-daemon
      - run:
          name: Build Web (Wasm)
          command: |
            export GRADLE_OPTS="-Xmx3g -XX:MaxMetaspaceSize=512m"
            ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon
          no_output_timeout: 30m
      - run:
          name: Prepare Backend Docker Context
          command: |
            mkdir -p build/docker/backend/deploy/server
            cp -r server/build/install/server/* build/docker/backend/deploy/server/
            # NOVO: Incluir o JSON do Firebase Admin no contexto do Docker
            if [ -f server/firebase-adminsdk.json ]; then
              cp server/firebase-adminsdk.json build/docker/backend/deploy/server/
            fi
            cp Dockerfile.server build/docker/backend/Dockerfile
      - run:
          name: Prepare Web Docker Context
          command: |
            mkdir -p build/docker/web/deploy/web

            # Localizar diretório de distribuição do Wasm
            WEB_DIST_DIR=$(find composeApp/build/dist/wasmJs -name "productionExecutable" -o -name "distribution" | head -n 1)

            if [ -n "$WEB_DIST_DIR" ]; then
              echo "Copiando artefatos de: $WEB_DIST_DIR"
              # Copia recursivamente para garantir skiko.js e outros subdiretórios (como composeResources)
              cp -rf "$WEB_DIST_DIR"/* build/docker/web/deploy/web/
            else
              echo "ERRO: Diretório de distribuição Wasm não encontrado!"
              exit 1
            fi

            cp Dockerfile.web build/docker/web/Dockerfile

            # --- NGINX CONFIG ---
            cat \<<EOF > build/docker/web/nginx.conf
            user  nginx;
            worker_processes  auto;
            error_log  /var/log/nginx/error.log warn;
            pid        /var/run/nginx.pid;
            events { worker_connections  1024; }
            http {
                include       /etc/nginx/mime.types;
                default_type  application/octet-stream;
                log_format  main  '\$remote_addr - \$remote_user [\$time_local] "\$request" '
                                  '\$status \$body_bytes_sent "\$http_referer" '
                                  '"\$http_user_agent" "\$http_x_forwarded_for"';
                access_log  /var/log/nginx/access.log  main;
                sendfile        on;
                keepalive_timeout  65;
                server {
                    listen 80;
                    server_name localhost victorbenevides.dev www.victorbenevides.dev;
                    location / {
                        return 301 https://\$host\$request_uri;
                    }
                }

                server {
                    listen 443 ssl;
                    server_name localhost victorbenevides.dev www.victorbenevides.dev;

                    ssl_certificate /etc/letsencrypt/live/victorbenevides.dev/fullchain.pem;
                    ssl_certificate_key /etc/letsencrypt/live/victorbenevides.dev/privkey.pem;

                    location / {
                        root   /usr/share/nginx/html;
                        index  index.html index.htm;
                        try_files \$uri \$uri/ /index.html;
                        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
                        add_header Cross-Origin-Embedder-Policy "unsafe-none" always;

                        # ANTI-CACHE: Força o navegador a buscar o index.html novo sempre
                        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
                    }
                    location /api/ {
                        proxy_pass http://genesys-server:8080;
                        proxy_http_version 1.1;
                        proxy_set_header Host \$host;
                        proxy_set_header X-Real-IP \$remote_addr;
                        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto \$scheme;
                    }
                }
            }
            EOF

      - run:
          name: Build and Push Docker Images (GHCR)
          command: |
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_USERNAME}" --password-stdin

            # Usamos o HASH do commit para evitar conflitos de cache no deploy
            COMMIT_HASH=$(echo $CIRCLE_SHA1 | cut -c1-7)

            # Backend
            docker build -t "ghcr.io/${GITHUB_USERNAME}/genesys-server:latest" -t "ghcr.io/${GITHUB_USERNAME}/genesys-server:$COMMIT_HASH" build/docker/backend/
            docker push "ghcr.io/${GITHUB_USERNAME}/genesys-server:latest"
            docker push "ghcr.io/${GITHUB_USERNAME}/genesys-server:$COMMIT_HASH"

            # Web
            docker build -t "ghcr.io/${GITHUB_USERNAME}/genesys-web:latest" -t "ghcr.io/${GITHUB_USERNAME}/genesys-web:$COMMIT_HASH" build/docker/web/
            docker push "ghcr.io/${GITHUB_USERNAME}/genesys-web:latest"
            docker push "ghcr.io/${GITHUB_USERNAME}/genesys-web:$COMMIT_HASH"

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Setup SSH and Deploy
          command: |
            set -x
            # 1. Validar variáveis
            if [ -z "${OCI_HOST}" ]; then echo "ERRO: OCI_HOST não configurada"; exit 1; fi
            if [ -z "${OCI_SSH_KEY}" ]; then echo "ERRO: OCI_SSH_KEY não configurada"; exit 1; fi
            if [ -z "${GITHUB_TOKEN}" ]; then echo "ERRO: GITHUB_TOKEN não configurada"; exit 1; fi
            if [ -z "${GITHUB_USERNAME}" ]; then echo "ERRO: GITHUB_USERNAME não configurada"; exit 1; fi

            # 2. Configurar SSH
            mkdir -p $HOME/.ssh
            python3 -c "import os, base64; key = os.environ['OCI_SSH_KEY'].strip(); path = os.path.expanduser('~/.ssh/oracle_key'); open(path, 'wb').write(base64.b64decode(key) if ' ' not in key else key.encode())"
            chmod 600 $HOME/.ssh/oracle_key

            COMMIT_HASH=$(echo $CIRCLE_SHA1 | cut -c1-7)

            # Diagnóstico de rede antes de começar
            echo "Alvo do Deploy: ${OCI_HOST} (Commit: $COMMIT_HASH)"
            echo "Verificando conectividade com ${OCI_HOST} na porta 22..."
            nc -zvw10 "${OCI_HOST}" 22 || echo "AVISO: Servidor inacessível na porta 22. O deploy provavelmente falhará por Firewall."

            # 3. Gerar Docker Compose LOCALMENTE
            cat \<<EOF > docker-compose.yml
            services:
              genesys-server:
                image: ghcr.io/${GITHUB_USERNAME}/genesys-server:$COMMIT_HASH
                container_name: genesys-server
                volumes:
                  - ./data:/app/data
                  - ./uploads:/app/uploads
                environment:
                  - DATABASE_URL=jdbc:sqlite:data/genesys21.db?journal_mode=WAL
                  - PROD_MODE=true
                  - DB_REBUILD=${DB_REBUILD:-false}
                  - OWNER_EMAIL=${OWNER_EMAIL:-victorkoto@gmail.com}
                  - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
                  - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
                  - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
                restart: unless-stopped
                networks:
                  - genesys-network

              genesys-web:
                image: ghcr.io/${GITHUB_USERNAME}/genesys-web:$COMMIT_HASH
                container_name: genesys-web
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - /etc/letsencrypt:/etc/letsencrypt:ro
                restart: unless-stopped
                networks:
                  - genesys-network

            networks:
              genesys-network:
                driver: bridge
            EOF

            # 4. Função de Retry para comandos instáveis
            run_retry() {
              for i in 1 2 3; do
                echo "Tentativa $i..."
                if "$@"; then return 0; fi
                echo "Falha. Aguardando 10s..."
                sleep 10
              done
              return 1
            }

            # 5. Executar Deploy com Retry, Verbose (-vvv) e timeouts maiores para diagnóstico
            SSH_CMD="ssh -vvv -i $HOME/.ssh/oracle_key -o StrictHostKeyChecking=no -o ConnectTimeout=30"
            SCP_CMD="scp -vvv -i $HOME/.ssh/oracle_key -o StrictHostKeyChecking=no -o ConnectTimeout=30"

            run_retry ${SSH_CMD} ubuntu@${OCI_HOST} "mkdir -p ~/app"
            run_retry ${SCP_CMD} docker-compose.yml ubuntu@${OCI_HOST}:~/app/docker-compose.yml

            echo "Iniciando atualização remota agressiva..."
            run_retry ${SSH_CMD} ubuntu@${OCI_HOST} \<<REMOTE_EOF
              cd ~/app
              echo "${GITHUB_TOKEN}" | sudo docker login ghcr.io -u "${GITHUB_USERNAME}" --password-stdin

              # LIMPEZA PROFUNDA: Garante que nenhuma imagem antiga sobreviva
              sudo docker compose down --remove-orphans || true
              sudo docker system prune -af --volumes || true

              echo "Baixando imagens do commit $COMMIT_HASH..."
              sudo docker pull ghcr.io/${GITHUB_USERNAME}/genesys-server:$COMMIT_HASH
              sudo docker pull ghcr.io/${GITHUB_USERNAME}/genesys-web:$COMMIT_HASH
              sudo docker compose up -d --force-recreate

              # Firewall
              sudo iptables -C INPUT -p tcp --dport 80 -j ACCEPT || sudo iptables -I INPUT 1 -p tcp --dport 80 -j ACCEPT
              sudo iptables -C INPUT -p tcp --dport 443 -j ACCEPT || sudo iptables -I INPUT 1 -p tcp --dport 443 -j ACCEPT
              sudo netfilter-persistent save || true

              echo "--- STATUS FINAL ---"
              sudo docker ps
              sudo docker image prune -f
            REMOTE_EOF

workflows:
  version: 2
  build-test-deploy:
    jobs:
      - test-and-validate
      - visual-verification
      - build-and-push:
          filters:
            branches:
              only: main
      - deploy:
          requires:
            - test-and-validate
            - visual-verification
            - build-and-push
          filters:
            branches:
              only: main
