version: 2.1

orbs:
  docker: circleci/docker@2.1.4

commands:
  prepare-env:
    description: "Prepare environment by decoding secrets or creating dummy configs"
    steps:
      - run:
          name: Prepare Environment & Decode Secrets
          command: |
            # 1. Tentar decodificar GOOGLE_SERVICES_JSON_ANDROID real
            if [ -n "$GOOGLE_SERVICES_JSON_ANDROID" ]; then
              CLEAN_VAR=$(echo "$GOOGLE_SERVICES_JSON_ANDROID" | tr -d '[:space:]')
              echo "$CLEAN_VAR" | base64 --decode > composeApp/google-services.json || echo "$GOOGLE_SERVICES_JSON_ANDROID" > composeApp/google-services.json
              echo "✓ Real google-services.json injected from environment."
            else
              # Fallback dummy com package_name CORRETO
              echo '{"project_info":{"project_number":"0","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"0","android_client_info":{"package_name":"com.itbenevides.genesys21"}},"api_key":[{"current_key":"dummy"}]}]}' > composeApp/google-services.json
              echo "⚠ Using dummy google-services.json (Missing env var)."
            fi

            # 2. Tentar decodificar FIREBASE_ADMIN_JSON real
            mkdir -p server/src/main/resources
            if [ -n "$FIREBASE_ADMIN_JSON" ]; then
              echo "${FIREBASE_ADMIN_JSON}" > server/firebase-adminsdk.json
              echo "${FIREBASE_ADMIN_JSON}" > server/src/main/resources/firebase-adminsdk.json
              echo "✓ Real firebase-adminsdk.json injected from environment."
            else
              echo '{"project_id":"dummy","private_key":"dummy","client_email":"dummy"}' > server/firebase-adminsdk.json
              echo '{"project_id":"dummy","private_key":"dummy","client_email":"dummy"}' > server/src/main/resources/firebase-adminsdk.json
              echo "⚠ Using dummy firebase-adminsdk.json (Missing env var)."
            fi

            # Criar diretório de dados para SQLite
            mkdir -p server/data

jobs:
  test-and-validate:
    docker:
      - image: cimg/android:2024.01
    resource_class: large
    environment:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" -Dorg.gradle.workers.max=2
    steps:
      - checkout
      - prepare-env
      - run:
          name: Run Unit Tests (Shared, App, Server)
          command: ./gradlew :shared:test :composeApp:testDebugUnitTest :server:test --no-daemon
      - run:
          name: Run Static Analysis
          command: ./gradlew lint --no-daemon

  visual-verification:
    docker:
      - image: cimg/android:2024.01
    resource_class: large
    environment:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=512m" -Dorg.gradle.workers.max=1
    steps:
      - checkout
      - prepare-env
      - run:
          name: Verify Visual Snapshots (Paparazzi)
          command: ./gradlew :screenshot-tests:verifyPaparazziDebug --no-daemon

  build-and-push:
    docker:
      - image: cimg/android:2024.01
    resource_class: large
    environment:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m"
    steps:
      - checkout
      - prepare-env
      - setup_remote_docker:
          version: 20.10.24
          docker_layer_caching: true
      - run:
          name: Build Backend (Server)
          command: ./gradlew :server:installDist --no-daemon
      - run:
          name: Build Web (Wasm)
          command: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon
          no_output_timeout: 30m
      - run:
          name: Prepare Backend Docker Context
          command: |
            mkdir -p build/docker/backend/deploy/server
            cp -r server/build/install/server/* build/docker/backend/deploy/server/
            cp Dockerfile.server build/docker/backend/Dockerfile
      - run:
          name: Prepare Web Docker Context
          command: |
            mkdir -p build/docker/web/deploy/web
            cp -r composeApp/build/dist/wasmJs/productionExecutable/* build/docker/web/deploy/web/
            cp Dockerfile.web build/docker/web/Dockerfile

            # --- WEB INTEROP BRIDGE (FIREBASE & PLATFORM) ---
            cat \<<EOF > build/docker/web/deploy/web/interop.js
            // Genesys21 Web Interop Bridge
            const auth = window.firebaseAuth;
            const db = window.firebaseDb;
            let oneTapInitialized = false;

            window.firebaseSignIn = (email, pass) => window.firebaseAuth.signInWithEmailAndPassword(window.firebaseAuth.getAuth(), email, pass).then(u => u.user.getIdToken());
            window.firebaseSignUp = (email, pass) => window.firebaseAuth.createUserWithEmailAndPassword(window.firebaseAuth.getAuth(), email, pass).then(u => u.user.getIdToken());
            window.firebaseSignInGoogle = () => {
                const provider = new window.firebaseAuth.GoogleAuthProvider();
                return window.firebaseAuth.signInWithPopup(window.firebaseAuth.getAuth(), provider).then(u => u.user.getIdToken());
            };
            window.firebaseGetToken = () => {
                const user = window.firebaseAuth.getAuth().currentUser;
                return user ? user.getIdToken(true) : Promise.resolve(null);
            };
            window.firebaseGetUserId = () => {
                const user = window.firebaseAuth.getAuth().currentUser;
                return Promise.resolve(user ? user.uid : null);
            };
            window.firebaseGetUserEmail = () => {
                const auth = window.firebaseAuth.getAuth();
                if (auth.currentUser) return Promise.resolve(auth.currentUser.email);
                return new Promise((resolve) => {
                    const unsubscribe = window.firebaseAuth.onAuthStateChanged(auth, user => {
                        unsubscribe();
                        resolve(user ? user.email : null);
                    });
                });
            };
            window.firebaseGetUserName = () => {
                const auth = window.firebaseAuth.getAuth();
                if (auth.currentUser) return Promise.resolve(auth.currentUser.displayName);
                return new Promise((resolve) => {
                    const unsubscribe = window.firebaseAuth.onAuthStateChanged(auth, user => {
                        unsubscribe();
                        resolve(user ? user.displayName : null);
                    });
                });
            };
            window.firebaseSignOut = () => {
                oneTapInitialized = false;
                return window.firebaseAuth.signOut(window.firebaseAuth.getAuth());
            };
            window.firebaseOnAuthChanged = (callback) => {
                window.firebaseAuth.onAuthStateChanged(window.firebaseAuth.getAuth(), (user) => {
                    callback(user ? user.uid : null);
                });
            };
            window.firebaseInitializeOneTap = () => {
                if (oneTapInitialized) return;
                oneTapInitialized = true;
                console.log("WASM: Initializing One Tap...");
            };

            // --- STRIPE BRIDGE ---
            let stripe;
            let elements;
            window.stripeInitialize = (publishableKey) => {
                stripe = Stripe(publishableKey);
            };
            window.stripeMountPaymentElement = (clientSecret, appearanceJson, elementId) => {
                if (!stripe) return Promise.reject("Stripe not initialized");
                const appearance = JSON.parse(appearanceJson);
                elements = stripe.elements({ clientSecret, appearance });
                const paymentElement = elements.create("payment");
                paymentElement.mount("#" + elementId);
                return Promise.resolve();
            };
            window.stripeConfirmPayment = (returnUrl) => {
                if (!stripe || !elements) return Promise.reject("Stripe not ready");
                return stripe.confirmPayment({
                    elements,
                    confirmParams: { return_url: returnUrl },
                });
            };
            EOF

            # --- NGINX CONFIG ---
            cat \<<EOF > build/docker/web/nginx.conf
            user  nginx;
            worker_processes  auto;
            error_log  /var/log/nginx/error.log warn;
            pid        /var/run/nginx.pid;
            events { worker_connections  1024; }
            http {
                include       /etc/nginx/mime.types;
                default_type  application/octet-stream;
                log_format  main  '\$remote_addr - \$remote_user [\$time_local] "\$request" '
                                  '\$status \$body_bytes_sent "\$http_referer" '
                                  '"\$http_user_agent" "\$http_x_forwarded_for"';
                access_log  /var/log/nginx/access.log  main;
                sendfile        on;
                keepalive_timeout  65;
                server {
                    listen 80;
                    server_name localhost;
                    location / {
                        root   /usr/share/nginx/html;
                        index  index.html index.htm;
                        try_files \$uri \$uri/ /index.html;
                        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
                        add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
                    }
                    location /api/ {
                        proxy_pass http://genesys-server:8080;
                        proxy_http_version 1.1;
                        proxy_set_header Host \$host;
                    }
                }
            }
            EOF

      - run:
          name: Build and Push Docker Images
          command: |
            # Verificar se as variáveis estão presentes
            if [ -z "${OCI_NAMESPACE}" ] || [ -z "${OCI_USERNAME}" ] || [ -z "${OCI_AUTH_TOKEN}" ]; then
              echo "ERRO: Variáveis de ambiente OCI (NAMESPACE, USERNAME ou AUTH_TOKEN) não estão configuradas no CircleCI."
              exit 1
            fi

            echo "${OCI_AUTH_TOKEN}" | docker login gru.ocir.io -u "${OCI_NAMESPACE}/${OCI_USERNAME}" --password-stdin

            # Backend
            docker build -t "gru.ocir.io/${OCI_NAMESPACE}/genesys-server:latest" build/docker/backend/
            docker push "gru.ocir.io/${OCI_NAMESPACE}/genesys-server:latest"

            # Web
            docker build -t "gru.ocir.io/${OCI_NAMESPACE}/genesys-web:latest" build/docker/web/
            docker push "gru.ocir.io/${OCI_NAMESPACE}/genesys-web:latest"

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Deploy via SSH
          command: |
            ssh -o StrictHostKeyChecking=no ubuntu@$SERVER_IP "
              mkdir -p ~/app && cd ~/app

              # Verificar se as variáveis estão presentes no ambiente remoto (se passadas via SSH) ou localmente no host de deploy
              # Nota: Variáveis passadas aqui devem estar configuradas no CircleCI
              if [ -z \"${OCI_NAMESPACE}\" ] || [ -z \"${OCI_USERNAME}\" ] || [ -z \"${OCI_AUTH_TOKEN}\" ]; then
                echo \"ERRO: Variáveis de ambiente OCI não disponíveis para o job de deploy.\"
                exit 1
              fi

              # 1. Login no OCIR
              echo \"${OCI_AUTH_TOKEN}\" | sudo docker login gru.ocir.io -u \"${OCI_NAMESPACE}/${OCI_USERNAME}\" --password-stdin

              # 2. Pull das imagens mais recentes
              sudo docker pull \"gru.ocir.io/${OCI_NAMESPACE}/genesys-server:latest\"
              sudo docker pull \"gru.ocir.io/${OCI_NAMESPACE}/genesys-web:latest\"

              # 3. Gerar Docker Compose dinamicamente se necessário (ou usar o existente)
              cat \<<EOF > docker-compose.yml
              services:
                genesys-server:
                  image: gru.ocir.io/${OCI_NAMESPACE}/genesys-server:latest
                  container_name: genesys-server
                  volumes:
                    - ./data:/app/data
                    - ./uploads:/app/uploads
                  environment:
                    - DATABASE_URL=jdbc:sqlite:data/genesys21.db?journal_mode=WAL
                    - PROD_MODE=true
                  restart: unless-stopped
                  networks:
                    - genesys-network

                genesys-web:
                  image: gru.ocir.io/${OCI_NAMESPACE}/genesys-web:latest
                  container_name: genesys-web
                  ports:
                    - \"80:80\"
                    - \"443:443\"
                  restart: unless-stopped
                  networks:
                    - genesys-network

              networks:
                genesys-network:
                  driver: bridge
            EOF

              # 4. Restart dos serviços
              sudo docker compose up -d --force-recreate
              sudo docker image prune -f
            "

workflows:
  version: 2
  build-test-deploy:
    jobs:
      - test-and-validate
      - visual-verification:
          requires:
            - test-and-validate
      - build-and-push:
          requires:
            - visual-verification
          filters:
            branches:
              only: main
      - deploy:
          requires:
            - build-and-push
          filters:
            branches:
              only: main
